<!DOCTYPE html>
<html lang="id">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Riwayat Kuis - Kenali Gaya Belajarmu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
           --bg-krem: #FFF9F3;
            --bg-kartu: #FFFFFF;
            --teks-utama: #3A2F52;
            --teks-pendukung: #6B6080;
            --garis-tipis: #EDE3F3;
            --visual: #8B7CF0;
            --auditori: #FF9F7A;
            --kinestetik: #5CCB9C;
            --bg-visual: #ECE8FF;
            --bg-auditori: #FFE9DE;
            --bg-kinestetik: #DDF6EA;
            --teks-badge: #2D3142;
            --galat: #C2334D;
            --berhasil: #23825B; 
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-krem: #1E1A2B;
                --bg-kartu: #2A2540;
                --teks-utama: #F3EEFA;
                --teks-pendukung: #BDB3D1;
                --garis-tipis: #3F3858;
                --bg-visual: #342F57;
                --bg-auditori: #4A3340;
                --bg-kinestetik: #24443A;
                --galat: #FF8DA1;
                --berhasil: #7FE0B5;
            }
        }

        body {
            background-color: var(--bg-krem);
            color: var(--teks-utama);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 2rem 1rem;
        }

        .narrow {
            max-width: 720px;
            margin: 0 auto;
        }

        h1.s {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            margin-bottom: 0.25rem;
        }
        
        p.sub {
            color: var(--teks-pendukung);
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .empty, .item {
            background-color: var(--bg-kartu);
            border: 2px solid var(--garis-tipis);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 16px rgba(58, 47, 82, 0.04);
        }

        .empty {
            text-align: center;
            padding: 2.5rem 1rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--visual);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn.ghost {
            background-color: var(--bg-visual);
            color: var(--visual);
        }

        .btn.red {
            background-color: transparent;
            border: 1.5px solid var(--galat);
            color: var(--galat);
        }

        /* Accordion Item */
        .item {
            padding: 0;
            overflow: hidden;
        }

        .head {
            width: 100%;
            background: none;
            border: none;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
            font-family: 'Nunito', sans-serif;
        }

        .pill {
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .date {
            color: var(--teks-pendukung);
            font-size: 0.9rem;
        }

        .chev {
            font-size: 1rem;
            color: var(--teks-pendukung);
            transition: transform 0.2s;
        }

        .body {
            padding: 0 1.5rem 1.5rem 1.5rem;
            border-top: 1px solid var(--garis-tipis);
        }

        .body.hidden {
            display: none;
        }
        /* Bar Progres Nilai */
        .row {
            margin-top: 1rem;
        }

        .lab {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .track {
            background-color: var(--garis-tipis);
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
        }

        .track > div {
            height: 100%;
            border-radius: 999px;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
    </style>
</head>
<body>
